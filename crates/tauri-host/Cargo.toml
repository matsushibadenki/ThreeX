[package]
name = "threex-tauri-host"
version = "0.1.0"
edition = "2024"
[dependencies]
threex-core = { path = "../core" }
threex-renderer = { path = "../renderer" }
wgpu.workspace = true
threex-storage = { path = "../storage" }
tauri = { version = "=2.12.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
[dev-dependencies]
tauri = { version = "=2.12.1", default-features = false, features = ["test", "unstable"] }
