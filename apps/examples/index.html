<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ThreeX MVP</title><style>body{margin:16px;background:#080d14;color:#eee;font:16px system-ui}canvas{display:block;width:100%;height:70vh}button,select{font:inherit;margin:8px 0;padding:8px}p{max-width:65ch}</style><h1>ThreeX</h1><select id="language"><option value="en">English</option><option value="ja">日本語</option><option value="zh">简体中文</option></select><p id="description"></p><button id="rotate"></button><canvas></canvas><p id="status" role="status"></p><script type="module">
import * as THREE from '../../packages/threex/index.js';
const texts={en:['Rust + WASM + WebGPU cube demo','Rotate cube','WebGPU initialization failed: '],ja:['Rust + WASM + WebGPUによる立方体デモ','立方体を回転','WebGPUの初期化に失敗しました: '],zh:['Rust + WASM + WebGPU 立方体演示','旋转立方体','WebGPU 初始化失败：']};const select=document.querySelector('select');function translate(){const t=texts[select.value];document.documentElement.lang=select.value;document.querySelector('#description').textContent=t[0];document.querySelector('button').textContent=t[1];}select.onchange=translate;translate();
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,1,.1,100);camera.position.z=4;const cube=new THREE.Mesh(new THREE.BoxGeometry(),new THREE.MeshBasicMaterial({color:0x44aa88}));scene.add(cube);const renderer=new THREE.WebGPURenderer({canvas:document.querySelector('canvas')});try{await renderer.init();const resize=()=>{const rect=renderer.domElement.getBoundingClientRect();renderer.setSize(rect.width,rect.height);camera.aspect=rect.width/rect.height;renderer.render(scene,camera);};new ResizeObserver(resize).observe(renderer.domElement);document.querySelector('button').onclick=()=>{cube.rotation.y+=.25;cube.rotation.x+=.1;renderer.render(scene,camera);};resize();}catch(e){document.querySelector('#status').textContent=texts[select.value][2]+e.message;}
</script></html>
